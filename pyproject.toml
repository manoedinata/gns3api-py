[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gns3api"
version = "0.1.0"
description = "Python wrapper to interact with GNS3 REST API. Tested on GNS3 3.0.6"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests", "websocket-client"]

[project.urls]
Homepage = "https://github.com/manoedinata/gns3api-py"

[tool.setuptools]
packages = ["gns3api"]
